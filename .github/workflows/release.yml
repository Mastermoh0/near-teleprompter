name: Signed Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Optional: explicitly enable only after configuring your own signing secrets.
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check version and restore private signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.NEAR_SIGNING_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -n "$SIGNING_KEYSTORE"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/near-release.p12"
          echo "NEAR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and check signed release
        env:
          NEAR_SIGNING_STORE_FILE: ${{ runner.temp }}/near-release.p12
          NEAR_SIGNING_STORE_PASSWORD: ${{ secrets.NEAR_SIGNING_STORE_PASSWORD }}
          NEAR_SIGNING_KEY_ALIAS: ${{ secrets.NEAR_SIGNING_KEY_ALIAS }}
          NEAR_SIGNING_KEY_PASSWORD: ${{ secrets.NEAR_SIGNING_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          apk="near-teleprompter-${NEAR_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release-artifacts/$apk"
          cd release-artifacts
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Publish APK and tutorial
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* TUTORIAL.md docs/tutorial-voiceover.txt --clobber
          else
            gh release create "$tag" release-artifacts/* TUTORIAL.md docs/tutorial-voiceover.txt \
              --verify-tag --title "Near ${NEAR_VERSION}" --notes-file docs/RELEASE_NOTES.md
          fi
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/near-release.p12"
